<meta name="claude:viewport-fit-sides" content="cover">
<title>Lvrk Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* Layout concept: single-screen app, sticky header + tab bar, scrolling content pane.
     Palette drawn from MotiveWave charts: void-black field, magenta bear, cyan-blue long box. */
  :root {
    --bg: #141414;
    --surface: #1a1a1a;
    --surface-raised: #212121;
    --surface-hover: #2a2a2a;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --fg: #e8e8e8;
    --fg-muted: #808080;
    --fg-dim: #3a3a3a;
    --accent: #CD073E;
    --accent-dim: rgba(205, 7, 62, 0.16);
    --loss: #757575;
    --loss-dim: rgba(117, 117, 117, 0.20);
    --win: #CD073E;
    --win-dim: rgba(205, 7, 62, 0.14);
    --warn: #cf8a28;
    --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 100;
    background: var(--bg);
  }

  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, select, textarea { font: inherit; color: inherit; background: none; border: 0; outline: 0; padding: 0; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 1px;
  }

  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- Header ---------- */
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  .header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 50;
    background: rgba(20, 20, 20, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    padding-block: 14px;
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-size: 15px;
  }
  .brand-mark {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-dim);
  }
  .header-spacer { flex: 1; }
  .header-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }
  .header-meta-label {
    font-size: 10px;
    color: var(--fg-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-meta-value {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .btn-add {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px 9px 12px;
    border-radius: 6px;
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.005em;
    transition: filter 120ms;
  }
  .btn-add:hover { filter: brightness(1.1); }
  .btn-add .plus {
    width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px; line-height: 1;
    font-weight: 400;
  }

  /* ---------- Tab bar ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    max-width: 1280px;
    margin: 10px auto 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-muted);
    letter-spacing: 0.01em;
    transition: color 100ms, background 100ms;
    white-space: nowrap;
  }
  .tab:hover { color: var(--fg); background: var(--surface-raised); }
  .tab.active { color: var(--fg); background: var(--surface-raised); }

  /* ---------- Main pane ---------- */
  .main {
    flex: 1;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    padding-block: 24px 80px;
  }
  .inner { max-width: 1280px; margin: 0 auto; }

  .section-label {
    font-size: 10px;
    color: var(--fg-muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .section-label::before {
    content: "";
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    transform: translateY(-2px);
  }

  /* ---------- KPI tiles ---------- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .kpi-label {
    font-size: 10px;
    color: var(--fg-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .kpi-value {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .kpi-sub {
    font-size: 11px;
    color: var(--fg-muted);
    font-family: var(--font-mono);
  }
  .kpi-value.pos { color: var(--win); }
  .kpi-value.neg { color: var(--loss); }

  /* ---------- Recent trades ---------- */
  .recent {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 0;
    overflow: hidden;
  }
  .recent-row {
    display: grid;
    grid-template-columns: 44px 70px 50px 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 11px 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background 80ms;
  }
  .recent-row:hover { background: var(--surface-hover); }
  .recent-row:first-child { border-top: 0; cursor: default; }
  .recent-row:first-child:hover { background: transparent; }
  .recent-row.head {
    font-family: var(--font-sans);
    font-size: 10px;
    color: var(--fg-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
    padding-top: 12px;
    padding-bottom: 8px;
    border-top: 0;
  }
  .recent-date { color: var(--fg-muted); font-size: 12px; }
  .side-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 20px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    font-family: var(--font-sans);
  }
  .side-long { background: var(--accent-dim); color: var(--accent); }
  .side-short { background: var(--loss-dim); color: var(--loss); }
  .pnl-pos { color: var(--win); }
  .pnl-neg { color: var(--loss); }
  .r-mult { color: var(--fg-muted); font-size: 12px; }
  .shot-thumb {
    width: 32px; height: 24px;
    border-radius: 3px;
    object-fit: cover;
    background: var(--surface-raised);
    border: 1px solid var(--border);
  }
  .shot-count {
    font-family: var(--font-sans);
    font-size: 10px;
    color: var(--fg-muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* ---------- Trades table ---------- */
  .trade-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow-x: auto;
  }
  table.trades {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 860px;
  }
  table.trades thead th {
    text-align: left;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    font-weight: 500;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
  }
  table.trades tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    vertical-align: middle;
  }
  table.trades tbody tr:last-child td { border-bottom: 0; }
  table.trades tbody tr { transition: background 80ms; cursor: pointer; }
  table.trades tbody tr:hover { background: var(--surface-hover); }
  table.trades td.right { text-align: right; }
  table.trades td.actions { text-align: right; }
  .btn-row-icon {
    color: var(--fg-dim);
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 11px;
    transition: color 100ms, background 100ms;
  }
  .btn-row-icon:hover { color: var(--fg); background: var(--surface-raised); }

  /* ---------- Filters bar ---------- */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters input, .filters select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 11px;
    font-size: 12px;
    color: var(--fg);
    min-width: 120px;
  }
  .filters input:focus, .filters select:focus { border-color: var(--accent); }
  .filters .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--fg-muted);
    font-family: var(--font-mono);
  }

  /* ---------- Stats ---------- */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .stat-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .stat-head {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-muted);
    font-weight: 500;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto auto;
    gap: 14px;
    padding: 10px 18px;
    font-size: 12px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    border-top: 1px solid var(--border);
    align-items: center;
  }
  .stat-row:first-of-type { border-top: 0; }
  .stat-row.head {
    font-family: var(--font-sans);
    color: var(--fg-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stat-row .name { font-family: var(--font-sans); font-weight: 500; color: var(--fg); font-size: 13px; }
  .stat-row .mut { color: var(--fg-muted); }

  /* ---------- Settings ---------- */
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .settings-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
  }
  .settings-block h3 {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin: 0 0 12px;
    font-weight: 500;
  }
  .settings-block p { font-size: 12px; color: var(--fg-muted); margin: 0 0 14px; line-height: 1.5; }
  .data-tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-ghost {
    padding: 9px 14px;
    border-radius: 5px;
    background: var(--surface-raised);
    border: 1px solid var(--border-strong);
    font-size: 12px;
    color: var(--fg);
    transition: background 100ms, border-color 100ms;
  }
  .btn-ghost:hover { background: var(--surface-hover); border-color: var(--fg-dim); }
  .btn-danger {
    padding: 9px 14px;
    border-radius: 5px;
    background: var(--surface-raised);
    border: 1px solid var(--loss-dim);
    color: var(--loss);
    font-size: 12px;
    transition: background 100ms;
  }
  .btn-danger:hover { background: var(--loss-dim); }

  .instr-table {
    width: 100%;
    font-family: var(--font-mono);
    font-size: 12px;
    border-collapse: collapse;
  }
  .instr-table th, .instr-table td { padding: 7px 0; text-align: left; font-weight: 400; }
  .instr-table th { color: var(--fg-muted); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-sans); border-bottom: 1px solid var(--border); }
  .instr-table td.right { text-align: right; }
  .instr-table .rm { color: var(--fg-dim); padding: 2px 6px; font-size: 11px; }
  .instr-table .rm:hover { color: var(--loss); }
  .instr-add {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-top: 12px;
  }
  .instr-add input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
    font-family: var(--font-mono);
  }
  .instr-add input:focus { border-color: var(--accent); }

  .chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
    min-height: 20px;
  }
  .chip-item {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 5px 4px 5px 11px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    color: var(--fg);
    font-family: var(--font-sans);
  }
  .chip-rm {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    color: var(--fg-dim);
    font-size: 14px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 100ms, background 100ms;
  }
  .chip-rm:hover { color: var(--loss); background: var(--loss-dim); }
  .chip-add {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  .chip-add input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 11px;
    font-size: 12px;
    font-family: var(--font-sans);
  }
  .chip-add input:focus { border-color: var(--accent); }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: max(60px, calc(env(safe-area-inset-top, 0px) + 40px)) 16px 60px;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    max-width: 720px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .modal-close { color: var(--fg-muted); font-size: 18px; padding: 4px 8px; border-radius: 4px; }
  .modal-close:hover { color: var(--fg); background: var(--surface-raised); }
  .modal-body { padding: 22px; }

  /* ---------- Form ---------- */
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 11px;
    color: var(--fg-muted);
    letter-spacing: 0.02em;
  }
  .field label .hint { color: var(--fg-dim); font-size: 10px; font-weight: 400; margin-left: 6px; }
  .field input, .field select, .field textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 9px 11px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    transition: border-color 100ms;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
  .field select { font-family: var(--font-sans); }
  .field textarea { resize: vertical; min-height: 60px; font-family: var(--font-sans); font-size: 13px; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .form-grid .full { grid-column: 1 / -1; }

  .side-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: var(--border);
    border-radius: 5px;
    overflow: hidden;
    padding: 2px;
  }
  .side-toggle button {
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    border-radius: 4px;
    color: var(--fg-muted);
    transition: background 100ms, color 100ms;
  }
  .side-toggle button.active[data-side="LONG"] { background: var(--accent-dim); color: var(--accent); }
  .side-toggle button.active[data-side="SHORT"] { background: var(--loss-dim); color: var(--loss); }

  .rating { display: flex; gap: 4px; }
  .rating button {
    flex: 1;
    padding: 8px 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--fg-muted);
    transition: border-color 100ms, color 100ms, background 100ms;
  }
  .rating button.active {
    background: var(--surface-raised);
    border-color: var(--accent);
    color: var(--accent);
  }

  .emo-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .emo-chips button {
    padding: 6px 11px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    color: var(--fg-muted);
    transition: border-color 100ms, color 100ms;
  }
  .emo-chips button.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* ---------- Screenshots dropzone ---------- */
  .dropzone {
    border: 1px dashed var(--border-strong);
    border-radius: 6px;
    padding: 18px;
    text-align: center;
    transition: border-color 120ms, background 120ms;
    cursor: pointer;
    background: var(--bg);
  }
  .dropzone:hover { border-color: var(--accent); background: var(--surface-raised); }
  .dropzone.drag { border-color: var(--accent); background: var(--accent-dim); }
  .dropzone-title { font-size: 12px; color: var(--fg); font-weight: 500; margin-bottom: 4px; }
  .dropzone-hint { font-size: 10px; color: var(--fg-muted); letter-spacing: 0.03em; }
  .dropzone-hint kbd {
    display: inline-block;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: var(--font-mono);
    font-size: 9px;
    margin: 0 2px;
  }
  .thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .thumb-wrap {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .thumb-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    cursor: zoom-in;
  }
  .thumb-wrap .rm-thumb {
    position: absolute;
    top: 4px; right: 4px;
    width: 20px; height: 20px;
    border-radius: 3px;
    background: rgba(0,0,0,0.72);
    color: var(--fg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: background 100ms, color 100ms;
  }
  .thumb-wrap .rm-thumb:hover { background: var(--loss); color: #ffffff; }

  .live-preview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-top: 18px;
  }
  .live-preview > div {
    background: var(--surface-raised);
    padding: 11px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .live-preview label {
    font-size: 9px;
    color: var(--fg-muted);

      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>

  <main class="main">
    <div class="inner" id="inner"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  // ====================================================================
  //  IndexedDB wrapper
  //  Stores trades (incl. compressed screenshot data URLs) and settings.
  // ====================================================================
  const DB_NAME = 'trade-log';
  const DB_VERSION = 1;
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('trades')) db.createObjectStore('trades', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      } catch (err) { reject(err); }
    });
    return dbPromise;
  }
  async function dbGetAll(store) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbGet(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbPut(store, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(value);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbDel(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbClear(store) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // ====================================================================
  //  Defaults
  // ====================================================================
  const DEFAULT_INSTRUMENTS = {
    'MNQ': 2, 'NQ': 20, 'MES': 5, 'ES': 50, 'MYM': 0.5, 'YM': 5,
    'M2K': 5, 'RTY': 50, 'MGC': 10, 'GC': 100, 'MCL': 100, 'CL': 1000,
  };
  // No defaults — user builds their own lists in Settings.

  // ====================================================================
  //  State
  // ====================================================================
  const DEFAULT_OBSIDIAN = {
    serverUrl: 'https://127.0.0.1:27124',
    apiKey: '',
    notesFolder: 'Trades',
    attachmentsFolder: 'Trades/attachments',
  };

  let state = {
    trades: [],
    instruments: { ...DEFAULT_INSTRUMENTS },
    setups: [],
    emotions: [],
    obsidian: { ...DEFAULT_OBSIDIAN },
  };
  let currentView = 'dash';
  let editingTradeId = null;
  let filterState = { instrument: '', setup: '', side: '' };

  async function loadState() {
    try {
      const [trades, instrSetting, setupsSetting, emotionsSetting, obsidianSetting] = await Promise.all([
        dbGetAll('trades'),
        dbGet('settings', 'instruments'),
        dbGet('settings', 'setups'),
        dbGet('settings', 'emotions'),
        dbGet('settings', 'obsidian'),
      ]);
      state.trades = trades || [];
      state.instruments = instrSetting?.value || { ...DEFAULT_INSTRUMENTS };
      state.setups = Array.isArray(setupsSetting?.value) ? setupsSetting.value : [];
      state.emotions = Array.isArray(emotionsSetting?.value) ? emotionsSetting.value : [];
      state.obsidian = { ...DEFAULT_OBSIDIAN, ...(obsidianSetting?.value || {}) };
    } catch (e) {
      console.warn('DB load failed, running in-memory only', e);
    }
  }
  async function saveTrade(trade) {
    try { await dbPut('trades', trade); } catch (e) { console.warn(e); }
  }
  async function deleteTradeFromDB(id) {
    try { await dbDel('trades', id); } catch (e) { console.warn(e); }
  }
  async function saveInstruments() {
    try { await dbPut('settings', { key: 'instruments', value: state.instruments }); } catch (e) {}
  }
  async function saveSetups() {
    try { await dbPut('settings', { key: 'setups', value: state.setups }); } catch (e) {}
  }
  async function saveEmotions() {
    try { await dbPut('settings', { key: 'emotions', value: state.emotions }); } catch (e) {}
  }
  async function saveObsidianSettings() {
    try { await dbPut('settings', { key: 'obsidian', value: state.obsidian }); } catch (e) {}
  }

  // ====================================================================
  //  Obsidian integration (Local REST API plugin)
  //  Pushes a trade as a markdown note + screenshots directly into the
  //  user's vault via the plugin's REST endpoints. Runs entirely from
  //  the browser, so it only works while Obsidian is open on the same
  //  machine and the plugin's CORS/certificate are accepted.
  // ====================================================================
  function obsidianConfigured() {
    return !!(state.obsidian.serverUrl && state.obsidian.apiKey);
  }
  function encodeVaultPath(path) {
    return path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  }
  function sanitizeFilename(s) {
    return (s || '').replace(/[\\/:*?"<>|]/g, '-').trim();
  }
  function dataUrlToBlob(dataUrl) {
    const [header, base64] = dataUrl.split(',');
    const mimeMatch = header.match(/data:(.*?);base64/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const binary = atob(base64);
    const arr = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  function buildObsidianMarkdown(trade, attachmentPaths) {
    const pnl = trade.exit != null ? tradePnL(trade) : null;
    const r = trade.exit != null ? tradeR(trade) : null;
    const risk = tradeRisk(trade);
    const baseName = `${trade.date} ${sanitizeFilename(trade.instrument)} ${trade.side} ${trade.id.slice(0, 6)}`;
    const filename = `${baseName}.md`;

    const tagList = ['trade'];
    if (trade.setup) tagList.push(`setup/${sanitizeFilename(trade.setup).replace(/\s+/g, '-')}`);
    if (trade.emotion) tagList.push(`emotion/${sanitizeFilename(trade.emotion).replace(/\s+/g, '-')}`);

    const fm = [
      '---',
      `date: ${trade.date}`,
      `time: "${trade.time || ''}"`,
      `instrument: "[[${trade.instrument}]]"`,
      `side: ${trade.side}`,
      `entry: ${trade.entry}`,
      `stop: ${trade.stop}`,
      `exit: ${trade.exit ?? ''}`,
      `size: ${trade.size}`,
      `dollar_per_point: ${trade.dollarPerPoint}`,
      `risk: ${risk.toFixed(2)}`,
      `pnl: ${pnl != null ? pnl.toFixed(2) : ''}`,
      `r_multiple: ${r != null && isFinite(r) ? r.toFixed(2) : ''}`,
      `rating: ${trade.rating ?? ''}`,
      trade.setup ? `setup: "[[${trade.setup}]]"` : 'setup:',
      trade.emotion ? `emotion: "[[${trade.emotion}]]"` : 'emotion:',
      `tags: [${tagList.join(', ')}]`,
      '---',
    ].join('\n');

    const headerLine = `# [[${trade.instrument}]] · ${trade.side} · ${pnl != null && r != null && isFinite(r) ? fmtR(r) : 'Open'}`;
    const statsLine = `**Entry** ${fmtPrice(trade.entry)} → **Exit** ${trade.exit != null ? fmtPrice(trade.exit) : 'open'} · **Stop** ${fmtPrice(trade.stop)} · **Risk** ${fmt$(risk)} · **P&L** ${pnl != null ? fmt$(pnl, { alwaysSign: true }) : '—'}`;
    const contextBits = [
      trade.setup ? `Setup: [[${trade.setup}]]` : '',
      trade.rating ? `Rating: ${trade.rating}/5` : '',
      trade.emotion ? `Emotion: [[${trade.emotion}]]` : '',
    ].filter(Boolean).join(' · ');
    const images = attachmentPaths.map(p => `![[${p}]]`).join('\n');
    const chartLinkLine = trade.chartLink ? `[Chart](${trade.chartLink})` : '';
    const noteBlock = trade.note ? `> ${trade.note.replace(/\n/g, '\n> ')}` : '';

    const body = [headerLine, '', statsLine, contextBits, '', images, chartLinkLine, noteBlock]
      .filter(line => line !== '' || true) // keep structural blank lines
      .join('\n')
      .replace(/\n{3,}/g, '\n\n');

    return { filename, content: `${fm}\n\n${body.trim()}\n` };
  }

  async function obsidianRequest(path, options = {}) {
    const cfg = state.obsidian;
    const url = `${cfg.serverUrl.replace(/\/$/, '')}/${path}`;
    return fetch(url, {
      ...options,
      headers: {
        'Authorization': `Bearer ${cfg.apiKey}`,
        ...(options.headers || {}),
      },
    });
  }

  async function testObsidianConnection() {
    if (!obsidianConfigured()) { toast('Fill in server URL and API key first'); return; }
    try {
      const res = await obsidianRequest('');
      if (res.ok) {
        toast('Connected to Obsidian');
        return true;
      }
      toast(`Obsidian responded with ${res.status} — check the API key`);
      return false;
    } catch (err) {
      console.error(err);
      toast('Could not reach Obsidian — see Settings for troubleshooting');
      return false;
    }
  }

  async function pushTradeToObsidian(trade) {
    if (!obsidianConfigured()) { toast('Configure Obsidian in Settings first'); return false; }
    const cfg = state.obsidian;
    const attachFolder = cfg.attachmentsFolder || 'Trades/attachments';
    const notesFolder = cfg.notesFolder || 'Trades';
    const shots = trade.screenshots || [];
    try {
      const attachmentPaths = [];
      for (let i = 0; i < shots.length; i++) {
        const blob = dataUrlToBlob(shots[i]);
        const ext = blob.type.includes('png') ? 'png' : 'jpg';
        const path = `${attachFolder}/${trade.id}-${i + 1}.${ext}`;
        const res = await obsidianRequest(`vault/${encodeVaultPath(path)}`, {
          method: 'PUT',
          headers: { 'Content-Type': blob.type || 'image/jpeg' },
          body: blob,
        });
        if (!res.ok) throw new Error(`Image upload failed (HTTP ${res.status})`);
        attachmentPaths.push(path);
      }
      const { filename, content } = buildObsidianMarkdown(trade, attachmentPaths);
      const notePath = `${notesFolder}/${filename}`;
      const res2 = await obsidianRequest(`vault/${encodeVaultPath(notePath)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'text/markdown' },
        body: content,
      });
      if (!res2.ok) throw new Error(`Note creation failed (HTTP ${res2.status})`);

      trade.obsidianSynced = true;
      trade.obsidianPath = notePath;
      await saveTrade(trade);
      toast('Pushed to Obsidian');
      return true;
    } catch (err) {
      console.error(err);
      toast('Obsidian push failed — likely CORS or an untrusted certificate. See Settings.');
      return false;
    }
  }

  async function copyTradeAsObsidianMarkdown(trade) {
    const shots = trade.screenshots || [];
    const attachFolder = state.obsidian.attachmentsFolder || 'Trades/attachments';
    const attachmentPaths = shots.map((s, i) => {
      const blob = dataUrlToBlob(s);
      const ext = blob.type.includes('png') ? 'png' : 'jpg';
      return `${attachFolder}/${trade.id}-${i + 1}.${ext}`;
    });
    const { content } = buildObsidianMarkdown(trade, attachmentPaths);
    try {
      await navigator.clipboard.writeText(content);
      toast(shots.length ? 'Markdown copied — save the screenshots separately with matching names' : 'Markdown copied to clipboard');
    } catch {
      toast('Copy failed — try the Push button instead');
    }
  }

  // ====================================================================
  //  Notion integration
  //  Calls this site's own Netlify Function (same origin, so no CORS
  //  issue), which holds the Notion secret server-side and talks to
  //  the Notion API on the trade's behalf.
  // ====================================================================
  async function pushTradeToNotion(trade) {
    const risk = tradeRisk(trade);
    const pnl = trade.exit != null ? tradePnL(trade) : null;
    const r = trade.exit != null ? tradeR(trade) : null;
    const payload = {
      trade: {
        id: trade.id,
        date: trade.date,
        time: trade.time,
        instrument: trade.instrument,
        side: trade.side,
        entry: trade.entry,
        stop: trade.stop,
        exit: trade.exit,
        size: trade.size,
        dollarPerPoint: trade.dollarPerPoint,
        risk,
        pnl,
        r: r != null && isFinite(r) ? r : null,
        setup: trade.setup,
        emotion: trade.emotion,
        rating: trade.rating,
        note: trade.note,
        chartLink: trade.chartLink,
      },
      screenshots: trade.screenshots || [],
    };
    try {
      const res = await fetch('/.netlify/functions/push-to-notion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        console.error(data);
        toast(`Notion push failed: ${data.error || 'unknown error'}`);
        return false;
      }
      trade.notionSynced = true;
      trade.notionUrl = data.url;
      await saveTrade(trade);
      toast('Pushed to Notion');
      return true;
    } catch (err) {
      console.error(err);
      toast('Could not reach the Notion function — check it is deployed');
      return false;
    }
  }

  // ====================================================================
  //  Calc
  // ====================================================================
  function tradeRisk(t) {
    if (!t.entry || !t.stop || !t.size || !t.dollarPerPoint) return 0;
    return Math.abs(t.entry - t.stop) * t.size * t.dollarPerPoint;
  }
  function tradePnL(t) {
    if (!t.entry || !t.exit || !t.size || !t.dollarPerPoint) return 0;
    const dir = t.side === 'LONG' ? 1 : -1;
    return (t.exit - t.entry) * t.size * t.dollarPerPoint * dir;
  }
  function tradeR(t) {
    const risk = tradeRisk(t);
    if (!risk) return 0;
    return tradePnL(t) / risk;
  }
  function sortedTrades(trades = state.trades) {
    return [...trades].sort((a, b) => {
      const dateA = (a.date || '') + (a.time || '');
      const dateB = (b.date || '') + (b.time || '');
      return dateA.localeCompare(dateB);
    });
  }
  function resolvedTrades(trades = state.trades) {
    return trades.filter(t => t.exit != null && t.entry != null && t.stop != null && t.size && t.dollarPerPoint);
  }

  // ====================================================================
  //  Formatting
  // ====================================================================
  function fmt$(n, opts = {}) {
    if (n == null || isNaN(n)) return '—';
    const abs = Math.abs(n);
    const sign = n < 0 ? '-' : (opts.alwaysSign && n > 0 ? '+' : '');
    return sign + '$' + abs.toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  function fmtPct(n, digits = 1) {
    if (n == null || isNaN(n)) return '—';
    return (n * 100).toFixed(digits) + '%';
  }
  function fmtR(n) {
    if (n == null || isNaN(n) || !isFinite(n)) return '—';
    const sign = n > 0 ? '+' : '';
    return sign + n.toFixed(2) + 'R';
  }
  function fmtPrice(n) {
    if (n == null || isNaN(n)) return '—';
    return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ====================================================================
  //  Image compression
  //  Resize to max 1800px side, encode JPEG q=0.82 → ~80-200KB typically.
  // ====================================================================
  async function compressImage(fileOrBlob, maxSide = 1800, quality = 0.82) {
    const dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(fileOrBlob);
    });
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSide || height > maxSide) {
          const ratio = Math.min(maxSide / width, maxSide / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#141414';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(dataUrl); // fallback: keep original
      img.src = dataUrl;
    });
  }
  async function filesToDataUrls(files) {
    const results = [];
    for (const f of files) {
      if (!f.type || !f.type.startsWith('image/')) continue;
      try { results.push(await compressImage(f)); }
      catch (e) { console.warn('compress failed', e); }
    }
    return results;
  }

  // ====================================================================
  //  Rendering
  // ====================================================================
  const inner = document.getElementById('inner');

  function updateHeader() {
    const resolved = resolvedTrades();
    const total = resolved.reduce((a, t) => a + tradePnL(t), 0);
    const el = document.getElementById('header-pnl');
    el.textContent = fmt$(total, { alwaysSign: true });
    el.style.color = total > 0 ? 'var(--win)' : (total < 0 ? 'var(--loss)' : 'var(--fg)');
  }

  function renderDashboard() {
    updateHeader();
    const resolved = resolvedTrades();
    const wins = resolved.filter(t => tradePnL(t) > 0);
    const losses = resolved.filter(t => tradePnL(t) < 0);
    const totalPnl = resolved.reduce((a, t) => a + tradePnL(t), 0);
    const totalR = resolved.reduce((a, t) => a + tradeR(t), 0);
    const avgR = resolved.length ? totalR / resolved.length : 0;
    const pf = losses.length ? wins.reduce((a, t) => a + tradePnL(t), 0) / Math.abs(losses.reduce((a, t) => a + tradePnL(t), 0)) : (wins.length ? Infinity : 0);
    const winRate = resolved.length ? wins.length / resolved.length : 0;
    const avgWin = wins.length ? wins.reduce((a, t) => a + tradePnL(t), 0) / wins.length : 0;
    const avgLoss = losses.length ? losses.reduce((a, t) => a + tradePnL(t), 0) / losses.length : 0;
    const bestTrade = resolved.length ? Math.max(...resolved.map(tradePnL)) : 0;
    const worstTrade = resolved.length ? Math.min(...resolved.map(tradePnL)) : 0;

    const recent = sortedTrades().slice(-6).reverse();

    inner.innerHTML = `
      <div class="section-label">Key stats</div>
      <div class="kpi-grid">
        <div class="kpi">
          <span class="kpi-label">Win rate</span>
          <span class="kpi-value">${resolved.length ? fmtPct(winRate, 0) : '—'}</span>
          <span class="kpi-sub">${wins.length}W · ${losses.length}L</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Profit factor</span>
          <span class="kpi-value ${pf > 1 ? 'pos' : (pf < 1 && pf > 0 ? 'neg' : '')}">${!resolved.length ? '—' : (pf === Infinity ? '∞' : pf.toFixed(2))}</span>
          <span class="kpi-sub">Gross wins / losses</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Expectancy</span>
          <span class="kpi-value ${avgR > 0 ? 'pos' : (avgR < 0 ? 'neg' : '')}">${resolved.length ? fmtR(avgR) : '—'}</span>
          <span class="kpi-sub">Avg R per trade</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Trades</span>
          <span class="kpi-value">${resolved.length}</span>
          <span class="kpi-sub">${state.trades.length - resolved.length} open</span>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <span class="kpi-label">Cumulative P&L</span>
          <span class="kpi-value ${totalPnl > 0 ? 'pos' : (totalPnl < 0 ? 'neg' : '')}">${resolved.length ? fmt$(totalPnl, { alwaysSign: true }) : '—'}</span>
          <span class="kpi-sub">Total realized</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Cumulative R</span>
          <span class="kpi-value ${totalR > 0 ? 'pos' : (totalR < 0 ? 'neg' : '')}">${resolved.length ? fmtR(totalR) : '—'}</span>
          <span class="kpi-sub">Sum of R</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Avg Win / Loss</span>
          <span class="kpi-value">${wins.length ? fmt$(avgWin) : '—'}<span style="color:var(--fg-dim);font-size:14px;"> / </span><span class="neg">${losses.length ? fmt$(avgLoss) : '—'}</span></span>
          <span class="kpi-sub">Average per trade</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Best / Worst</span>
          <span class="kpi-value"><span class="pos">${resolved.length ? fmt$(bestTrade) : '—'}</span><span style="color:var(--fg-dim);font-size:14px;"> / </span><span class="neg">${resolved.length ? fmt$(worstTrade) : '—'}</span></span>
          <span class="kpi-sub">Extremes</span>
        </div>
      </div>

      <div class="section-label">Recent trades</div>
      <div class="recent">
        ${recent.length === 0 ? `
          <div class="empty">
            <h3>No trades yet</h3>
            <p>Log your first trade to get started.</p>
            <button class="cta" onclick="openWizard()"><span>+</span> First trade</button>
          </div>
        ` : `
          <div class="recent-row head">
            <span>Pic</span>
            <span>Date</span>
            <span>Side</span>
            <span>Instrument · setup</span>
            <span>R</span>
            <span style="text-align:right">P&L</span>
          </div>
          ${recent.map(t => {
            const pnl = tradePnL(t);
            const r = tradeR(t);
            const shots = t.screenshots || [];
            return `
            <div class="recent-row" data-open="${t.id}">
              <span>${shots.length > 0 ? `<img class="shot-thumb" src="${shots[0]}" alt="">` : `<span class="shot-count">—</span>`}</span>
              <span class="recent-date">${t.date}${t.time ? ' <span style="color:var(--fg-dim)">·</span> ' + t.time : ''}</span>
              <span class="side-pill ${t.side === 'LONG' ? 'side-long' : 'side-short'}">${t.side}</span>
              <span><span style="color:var(--fg)">${t.instrument}</span> <span style="color:var(--fg-muted); font-family: var(--font-sans); font-size: 11px;">${t.setup || ''}</span></span>
              <span class="r-mult">${t.exit != null ? fmtR(r) : '—'}</span>
              <span class="${pnl > 0 ? 'pnl-pos' : (pnl < 0 ? 'pnl-neg' : '')}" style="text-align:right">${t.exit != null ? fmt$(pnl, { alwaysSign: true }) : '—'}</span>
            </div>
            `;
          }).join('')}
        `}
      </div>
    `;
    inner.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openTradeModal(el.dataset.open)));
  }

  function renderTrades() {
    updateHeader();
    const trades = sortedTrades().reverse();
    const filtered = trades.filter(t => {
      if (filterState.instrument && t.instrument !== filterState.instrument) return false;
      if (filterState.setup && t.setup !== filterState.setup) return false;
      if (filterState.side && t.side !== filterState.side) return false;
      return true;
    });

    const uniqueInstruments = [...new Set(trades.map(t => t.instrument).filter(Boolean))].sort();
    const uniqueSetups = [...new Set(trades.map(t => t.setup).filter(Boolean))].sort();

    if (!trades.length) {
      inner.innerHTML = `
        <div class="empty" style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px;">
          <h3>No trades yet</h3>
          <p>Log your first trade — your stats update live.</p>
          <button class="cta" onclick="openWizard()"><span>+</span> New trade</button>
        </div>
      `;
      return;
    }

    inner.innerHTML = `
      <div class="filters">
        <select id="flt-instr">
          <option value="">All instruments</option>
          ${uniqueInstruments.map(i => `<option ${filterState.instrument === i ? 'selected' : ''}>${i}</option>`).join('')}
        </select>
        <select id="flt-setup">
          <option value="">All setups</option>
          ${uniqueSetups.map(s => `<option ${filterState.setup === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <select id="flt-side">
          <option value="">Long + Short</option>
          <option value="LONG" ${filterState.side === 'LONG' ? 'selected' : ''}>LONG</option>
          <option value="SHORT" ${filterState.side === 'SHORT' ? 'selected' : ''}>SHORT</option>
        </select>
        <span class="count">${filtered.length} / ${trades.length}</span>
      </div>
      <div class="trade-table-wrap">
        <table class="trades">
          <thead>
            <tr>
              <th></th>
              <th>Date</th>
              <th>Instrument</th>
              <th>Side</th>
              <th class="right">Entry</th>
              <th class="right">Stop</th>
              <th class="right">Exit</th>
              <th class="right">Size</th>
              <th class="right">Risk</th>
              <th class="right">P&L</th>
              <th class="right">R</th>
              <th>Setup</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(t => {
              const pnl = tradePnL(t);
              const r = tradeR(t);
              const risk = tradeRisk(t);
              const shots = t.screenshots || [];
              return `
              <tr data-open="${t.id}">
                <td>${shots.length > 0 ? `<img class="shot-thumb" src="${shots[0]}" alt="">` : ''}</td>
                <td style="color: var(--fg-muted)">${t.date}${t.time ? '<br><span style="font-size:10px;color:var(--fg-dim)">'+t.time+'</span>' : ''}</td>
                <td>${t.instrument}</td>
                <td><span class="side-pill ${t.side === 'LONG' ? 'side-long' : 'side-short'}">${t.side}</span></td>
                <td class="right">${fmtPrice(t.entry)}</td>
                <td class="right" style="color: var(--fg-muted)">${fmtPrice(t.stop)}</td>
                <td class="right">${t.exit != null ? fmtPrice(t.exit) : '<span style="color:var(--fg-dim)">—</span>'}</td>
                <td class="right">${t.size}</td>
                <td class="right" style="color: var(--fg-muted)">${fmt$(risk)}</td>
                <td class="right ${pnl > 0 ? 'pnl-pos' : (pnl < 0 ? 'pnl-neg' : '')}">${t.exit != null ? fmt$(pnl, { alwaysSign: true }) : '—'}</td>
                <td class="right ${r > 0 ? 'pnl-pos' : (r < 0 ? 'pnl-neg' : '')}">${t.exit != null ? fmtR(r) : '—'}</td>
                <td style="color: var(--fg-muted); font-family: var(--font-sans); font-size: 12px;">${t.setup || '—'}</td>
                <td class="actions">
                  <button class="btn-row-icon" data-del="${t.id}" title="Delete">×</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    inner.querySelectorAll('[data-open]').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('[data-del]')) return;
        openTradeModal(row.dataset.open);
      });
    });
    inner.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!window.confirm('Delete this trade?')) return;
      state.trades = state.trades.filter(t => t.id !== b.dataset.del);
      await deleteTradeFromDB(b.dataset.del);
      renderTrades();
      toast('Trade deleted');
    }));
    document.getElementById('flt-instr').addEventListener('change', (e) => { filterState.instrument = e.target.value; renderTrades(); });
    document.getElementById('flt-setup').addEventListener('change', (e) => { filterState.setup = e.target.value; renderTrades(); });
    document.getElementById('flt-side').addEventListener('change', (e) => { filterState.side = e.target.value; renderTrades(); });
  }

  function renderStats() {
    updateHeader();
    const resolved = resolvedTrades();
    if (!resolved.length) {
      inner.innerHTML = `
        <div class="empty" style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px;">
          <h3>No stats yet</h3>
          <p>Add a few trades to see your patterns.</p>
        </div>
      `;
      return;
    }

    const by = (keyFn) => {
      const groups = {};
      for (const t of resolved) {
        const k = keyFn(t) || '—';
        if (!groups[k]) groups[k] = { n: 0, wins: 0, pnl: 0, r: 0, rCount: 0 };
        const pnl = tradePnL(t);
        const r = tradeR(t);
        groups[k].n += 1;
        if (pnl > 0) groups[k].wins += 1;
        groups[k].pnl += pnl;
        if (!isNaN(r) && isFinite(r)) { groups[k].r += r; groups[k].rCount += 1; }
      }
      return Object.entries(groups).sort((a, b) => b[1].pnl - a[1].pnl);
    };

    const dayName = (dateStr) => {
      if (!dateStr) return '—';
      const d = new Date(dateStr + 'T12:00:00');
      return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
    };

    const blocks = [
      { title: 'By instrument', data: by(t => t.instrument) },
      { title: 'By day of week', data: by(t => dayName(t.date)) },
      { title: 'By setup', data: by(t => t.setup) },
      { title: 'By emotion', data: by(t => t.emotion) },
    ];

    inner.innerHTML = `
      <div class="section-label">Breakdown</div>
      <div class="stats-grid">
        ${blocks.map(b => `
          <div class="stat-block">
            <div class="stat-head">${b.title}</div>
            <div class="stat-row head">
              <span>Category</span>
              <span class="mut">N</span>
              <span class="mut">WR</span>
              <span class="mut">R̄</span>
              <span class="mut" style="text-align:right">P&L</span>
            </div>
            ${b.data.length === 0 ? '<div class="stat-row"><span class="mut" style="font-family: var(--font-sans);">—</span><span></span><span></span><span></span><span></span></div>' :
              b.data.map(([name, g]) => `
                <div class="stat-row">
                  <span class="name">${name}</span>
                  <span class="mut">${g.n}</span>
                  <span class="mut">${fmtPct(g.wins / g.n, 0)}</span>
                  <span class="mut">${g.rCount ? (g.r/g.rCount).toFixed(2) : '—'}</span>
                  <span class="${g.pnl > 0 ? 'pnl-pos' : (g.pnl < 0 ? 'pnl-neg' : '')}" style="text-align:right">${fmt$(g.pnl, { alwaysSign: true })}</span>
                </div>
              `).join('')}
          </div>
        `).join('')}
      </div>
    `;
  }

      toast('Setup removed');

      const el = document.getElementById('add-setup');

      if (!val) return;
      if (state.setups.includes(val)) { toast('Already in list'); return; }
      state.setups.push(val);
      await saveSetups();
      renderSettings();
      toast(val + ' added');

    // Notion
    document.getElementById('btn-notion-test').addEventListener('click', async () => {
      const statusEl = document.getElementById('notion-status');
      statusEl.textContent = 'Checking…';
      try {
        const res = await fetch('/.netlify/functions/push-to-notion');

        if (data.ok) {
          statusEl.textContent = 'Connected ✓';
          statusEl.style.color = 'var(--win)';
          toast('Connected to Notion');
        } else {
          statusEl.textContent = data.reason || 'Not configured yet';
          statusEl.style.color = 'var(--loss)';
        }
      } catch (err) {
        statusEl.textContent = 'Function not found — is the site deployed from Git with the function included?';
        statusEl.style.color = 'var(--loss)';
      }
    });
  }
