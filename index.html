                <div class="dropzone-hint"><kbd>⌘</kbd><kbd>V</kbd> / <kbd>Ctrl</kbd><kbd>V</kbd> from clipboard · drag & drop a file · click for gallery</div>
              </div>
              <input id="file-input" type="file" accept="image/*" multiple hidden>
              <div class="thumbs" id="thumbs"></div>
            </div>

            <div class="field full">
              <label>Chart link <span class="hint">optional · TradingView snapshot or other</span></label>
              <input id="f-chartLink" type="url" value="${draft.chartLink || ''}" placeholder="https://www.tradingview.com/x/...">
            </div>
            <div class="field full">
              <label>Note</label>
              <textarea id="f-note" placeholder="What you want to remember about this trade">${draft.note || ''}</textarea>
            </div>
          </div>

          <div class="live-preview" id="live-preview">
            <div><label>Risk</label><span id="prev-risk">—</span></div>
            <div><label>P&L</label><span id="prev-pnl">—</span></div>
            <div><label>R multiple</label><span id="prev-r">—</span></div>
          </div>
        </div>
        <div class="modal-foot" style="flex-wrap: wrap; gap: 8px;">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap: wrap;">
            ${existing ? `<button class="btn-danger" id="del-trade">Delete</button>` : ''}
            ${existing ? `<button class="btn-ghost" id="push-notion">Push to Notion</button>` : ''}
            ${existing ? `<button class="btn-ghost" id="push-obsidian">Push to Obsidian</button>` : ''}
            ${existing ? `<button class="btn-ghost" id="copy-obsidian">Copy as Markdown</button>` : ''}
            ${existing && draft.notionSynced ? `<span style="font-size:10px; color: var(--win); font-family: var(--font-mono);">✓ Notion</span>` : ''}
            ${existing && draft.obsidianSynced ? `<span style="font-size:10px; color: var(--win); font-family: var(--font-mono);">✓ Obsidian</span>` : ''}
            ${!existing ? `<span style="color:var(--fg-dim); font-size:11px;">Saved locally</span>` : ''}
          </div>
          <button class="btn-primary" id="save-trade">${existing ? 'Update' : 'Save'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    const close = () => {
      if (activePasteHandler) {
        window.removeEventListener('paste', activePasteHandler);
        activePasteHandler = null;
      }
      backdrop.remove();
    };
    backdrop.querySelector('.modal-close').addEventListener('click', close);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });

    // Side toggle
    backdrop.querySelector('#side-toggle').querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        draft.side = b.dataset.side;
        backdrop.querySelectorAll('#side-toggle button').forEach(x => x.classList.toggle('active', x.dataset.side === draft.side));
        updatePreview();
      });
    });
    backdrop.querySelector('#rating-group').querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        draft.rating = parseInt(b.dataset.rate);
        backdrop.querySelectorAll('#rating-group button').forEach(x => x.classList.toggle('active', parseInt(x.dataset.rate) === draft.rating));
      });
    });
    const emoGroup = backdrop.querySelector('#emo-group');
    if (emoGroup) {
      emoGroup.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          draft.emotion = draft.emotion === b.dataset.emo ? '' : b.dataset.emo;
          backdrop.querySelectorAll('#emo-group button').forEach(x => x.classList.toggle('active', x.dataset.emo === draft.emotion));
        });
      });
    }
    const emoFreeField = backdrop.querySelector('#f-emotion-free');
    if (emoFreeField) {
      emoFreeField.addEventListener('input', (e) => { draft.emotion = e.target.value.trim(); });
    }

    // Instrument auto-fill
    const instrInput = backdrop.querySelector('#f-instrument');
    const dollarInput = backdrop.querySelector('#f-dollarPerPoint');
    instrInput.addEventListener('input', () => {
      const key = instrInput.value.trim().toUpperCase();
      let dpp = state.instruments[key];
      if (dpp == null) {
        const found = Object.keys(state.instruments).find(k => key.startsWith(k));
        if (found) dpp = state.instruments[found];
      }
      if (dpp != null) dollarInput.value = dpp;
      updatePreview();
    });

    // Live preview
    function readDraft() {
      draft.instrument = instrInput.value.trim().toUpperCase();
      draft.entry = parseFloat(backdrop.querySelector('#f-entry').value) || null;
      draft.stop = parseFloat(backdrop.querySelector('#f-stop').value) || null;
      const exitVal = backdrop.querySelector('#f-exit').value;
      draft.exit = exitVal === '' ? null : (parseFloat(exitVal) || null);
      draft.size = parseFloat(backdrop.querySelector('#f-size').value) || 0;
      draft.dollarPerPoint = parseFloat(backdrop.querySelector('#f-dollarPerPoint').value) || 0;
      draft.setup = backdrop.querySelector('#f-setup').value;
      draft.date = backdrop.querySelector('#f-date').value;
      draft.time = backdrop.querySelector('#f-time').value;
      draft.note = backdrop.querySelector('#f-note').value;
      draft.chartLink = backdrop.querySelector('#f-chartLink').value;
    }
    function updatePreview() {
      readDraft();
      const risk = tradeRisk(draft);
      const pnl = draft.exit != null ? tradePnL(draft) : null;
      const r = draft.exit != null ? tradeR(draft) : null;
      backdrop.querySelector('#prev-risk').textContent = risk ? fmt$(risk) : '—';
      const pnlEl = backdrop.querySelector('#prev-pnl');
      pnlEl.textContent = pnl != null ? fmt$(pnl, { alwaysSign: true }) : '—';
      pnlEl.className = pnl > 0 ? 'pos' : (pnl < 0 ? 'neg' : '');
      const rEl = backdrop.querySelector('#prev-r');
      rEl.textContent = r != null && isFinite(r) ? fmtR(r) : '—';
      rEl.className = r > 0 ? 'pos' : (r < 0 ? 'neg' : '');
    }
    ['entry','stop','exit','size','dollarPerPoint'].forEach(f =>
      backdrop.querySelector('#f-' + f).addEventListener('input', updatePreview)
    );
    updatePreview();

    // ----- Screenshots -----
    const dropzone = backdrop.querySelector('#dropzone');
    const fileInput = backdrop.querySelector('#file-input');
    const thumbs = backdrop.querySelector('#thumbs');

    function renderThumbs() {
      thumbs.innerHTML = draft.screenshots.map((src, i) => `
        <div class="thumb-wrap">
          <img src="${src}" alt="Screenshot ${i+1}" data-view="${i}">
          <button class="rm-thumb" data-rm="${i}" aria-label="Remove">×</button>
        </div>
      `).join('');
      thumbs.querySelectorAll('[data-view]').forEach(img => {
        img.addEventListener('click', () => openLightbox(img.src));
      });
      thumbs.querySelectorAll('[data-rm]').forEach(btn => {
        btn.addEventListener('click', () => {
          draft.screenshots.splice(parseInt(btn.dataset.rm), 1);
          renderThumbs();
        });
      });
    }
    renderThumbs();

    async function addFiles(files) {
      if (!files || !files.length) return;
      dropzone.querySelector('.dropzone-title').textContent = 'Processing…';
      const urls = await filesToDataUrls(files);
      draft.screenshots.push(...urls);
      dropzone.querySelector('.dropzone-title').textContent = 'Drop, paste or click to add';
      renderThumbs();
      if (urls.length) toast(urls.length + ' image' + (urls.length > 1 ? 's' : '') + ' added');
    }

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => addFiles(e.target.files));
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag');
      addFiles(e.dataTransfer.files);
    });
    activePasteHandler = (e) => {
      const items = e.clipboardData?.items || [];
      const files = [];
      for (const it of items) {
        if (it.kind === 'file') {
          const f = it.getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length) {
        e.preventDefault();
        addFiles(files);
      }
    };
    window.addEventListener('paste', activePasteHandler);

    // Save
    backdrop.querySelector('#save-trade').addEventListener('click', async () => {
      readDraft();
      if (!draft.instrument || !draft.entry || !draft.stop || !draft.size || !draft.dollarPerPoint) {
        toast('Instrument, entry, stop, size and $/point required');
        return;
      }
      // Save instrument to known list if new
      if (!state.instruments[draft.instrument]) {
        state.instruments[draft.instrument] = draft.dollarPerPoint;
        await saveInstruments();
      }
      if (draft.setup && !state.setups.includes(draft.setup)) {
        state.setups.push(draft.setup);
        await saveSetups();
      }
      if (draft.emotion && !state.emotions.includes(draft.emotion)) {
        state.emotions.push(draft.emotion);
        await saveEmotions();
      }
      if (editingTradeId) {
        state.trades = state.trades.map(t => t.id === editingTradeId ? draft : t);
        toast('Trade updated');
      } else {
        state.trades.push(draft);
        toast('Trade saved');
      }
      await saveTrade(draft);
      close();
      render();
    });

    if (existing) {
      backdrop.querySelector('#del-trade').addEventListener('click', async () => {
        if (!window.confirm('Delete this trade?')) return;
        state.trades = state.trades.filter(t => t.id !== editingTradeId);
        await deleteTradeFromDB(editingTradeId);
        close();
        render();
        toast('Trade deleted');
      });
      backdrop.querySelector('#push-obsidian').addEventListener('click', async (e) => {
        e.target.textContent = 'Pushing…';
        e.target.disabled = true;
        const ok = await pushTradeToObsidian(draft);
        e.target.disabled = false;
        e.target.textContent = 'Push to Obsidian';
        if (ok) { close(); render(); }
      });
      backdrop.querySelector('#copy-obsidian').addEventListener('click', () => {
        copyTradeAsObsidianMarkdown(draft);
      });
      backdrop.querySelector('#push-notion').addEventListener('click', async (e) => {
        e.target.textContent = 'Pushing…';
        e.target.disabled = true;
        const ok = await pushTradeToNotion(draft);
        e.target.disabled = false;
        e.target.textContent = 'Push to Notion';
        if (ok) { close(); render(); }
      });
    }

    setTimeout(() => {
      const target = existing ? backdrop.querySelector('#f-exit') : backdrop.querySelector('#f-instrument');
      target?.focus();
    }, 50);
  }

  // ====================================================================
  //  Wizard (QCM mode)
  //  5 quick steps, auto-advance when possible.
  //  Steps 4-5 skippable. "Detailed mode" link to switch.
  // ====================================================================
  let wizPasteHandler = null;

  function openWizard(prefill = null) {
    const now = new Date();
    const draft = prefill || {
      id: Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4),
      date: now.toISOString().slice(0, 10),
      time: now.toTimeString().slice(0, 5),
      instrument: '',
      side: null,
      entry: null,
      stop: null,
      exit: null,
      exitOpen: false,
      size: null,
      dollarPerPoint: null,
      setup: '',
      rating: null,
      emotion: '',
      note: '',
      chartLink: '',
      screenshots: [],
    };
    if (!draft.screenshots) draft.screenshots = [];

    let step = 1;
    const totalSteps = 5;

    const backdrop = document.createElement('div');
    backdrop.className = 'wiz-backdrop';
    backdrop.innerHTML = `
      <div class="wiz">
        <div class="wiz-top">
          <span class="wiz-step-indicator" id="wiz-ind">1 / ${totalSteps}</span>
          <div class="wiz-progress-track"><div class="wiz-progress-fill" id="wiz-fill" style="width: ${100/totalSteps}%"></div></div>
          <button class="wiz-close" aria-label="Close">×</button>
        </div>
        <div class="wiz-content" id="wiz-content"></div>
        <div class="wiz-foot">
          <button class="back" id="wiz-back" disabled>← Back</button>
          <span class="spacer"></span>
          <button class="skip" id="wiz-skip" style="display:none">Skip</button>
          <button class="next" id="wiz-next">Next</button>
        </div>
        <div class="wiz-detailed-link">
          <button id="wiz-detailed">Open detailed mode</button>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    const content = backdrop.querySelector('#wiz-content');
    const fill = backdrop.querySelector('#wiz-fill');
    const ind = backdrop.querySelector('#wiz-ind');
    const backBtn = backdrop.querySelector('#wiz-back');
    const nextBtn = backdrop.querySelector('#wiz-next');
    const skipBtn = backdrop.querySelector('#wiz-skip');

    const close = () => {
      if (wizPasteHandler) {
        window.removeEventListener('paste', wizPasteHandler);
        wizPasteHandler = null;
      }
      backdrop.remove();
    };
    backdrop.querySelector('.wiz-close').addEventListener('click', close);

    backdrop.querySelector('#wiz-detailed').addEventListener('click', () => {
      close();
      openTradeModal(null, draft);
    });

    function tradeRiskD() { return tradeRisk(draft); }
    function tradePnLD() { return draft.exit != null && !draft.exitOpen ? tradePnL(draft) : null; }
    function tradeRD() { const r = tradeR(draft); return draft.exit != null && !draft.exitOpen ? r : null; }

    function updateFoot() {
      ind.textContent = `${step} / ${totalSteps}`;
      fill.style.width = (step / totalSteps * 100) + '%';
      backBtn.disabled = step === 1;
      skipBtn.style.display = (step === 4 || step === 5) ? 'inline-block' : 'none';
      nextBtn.textContent = step === totalSteps ? 'Save' : 'Next';
      nextBtn.classList.toggle('save', step === totalSteps);
      nextBtn.disabled = !canAdvance();
    }

    function canAdvance() {
      if (step === 1) return !!draft.instrument && !!draft.dollarPerPoint;
      if (step === 2) return !!draft.side && draft.size > 0;
      if (step === 3) return draft.entry != null && draft.stop != null && (draft.exitOpen || draft.exit != null);
      return true;
    }

    function go(next) {
      if (next > totalSteps) { save(); return; }
      if (next < 1) return;
      step = next;
      renderStep();
    }

    backBtn.addEventListener('click', () => go(step - 1));
    nextBtn.addEventListener('click', () => { if (canAdvance()) go(step + 1); });
    skipBtn.addEventListener('click', () => go(step + 1));

    // Keyboard
    const onKey = (e) => {
      if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        if (canAdvance()) go(step + 1);
      } else if (e.key === 'Escape') {
        close();
      }
    };
    backdrop.addEventListener('keydown', onKey);

    async function save() {
      if (!draft.instrument || !draft.entry || !draft.stop || !draft.size || !draft.dollarPerPoint) {
        toast('Missing essential info');
        return;
      }
      if (draft.exitOpen) draft.exit = null;
      if (!state.instruments[draft.instrument]) {
        state.instruments[draft.instrument] = draft.dollarPerPoint;
        await saveInstruments();
      }
      if (draft.setup && !state.setups.includes(draft.setup)) {
        state.setups.push(draft.setup);
        await saveSetups();
      }
      if (draft.emotion && !state.emotions.includes(draft.emotion)) {
        state.emotions.push(draft.emotion);
        await saveEmotions();
      }
      // If prefill was for an existing trade, replace it
      const existingIdx = state.trades.findIndex(t => t.id === draft.id);
      if (existingIdx >= 0) {
        state.trades[existingIdx] = draft;
        toast('Trade updated');
      } else {
        state.trades.push(draft);
        toast('Trade saved');
      }
      await saveTrade(draft);
      close();
      render();
    }

    // -------------------- Steps renderers --------------------
    function renderStep() {
      if (step === 1) return renderInstrument();
      if (step === 2) return renderSideSize();
      if (step === 3) return renderPrices();
      if (step === 4) return renderContext();
      if (step === 5) return renderReview();
    }

    function renderInstrument() {
      const known = Object.entries(state.instruments).sort((a, b) => a[0].localeCompare(b[0]));
      content.innerHTML = `
        <div class="wiz-step active">
          <h2 class="wiz-q">Which instrument?</h2>
          <p class="wiz-hint">Pick or type the symbol. $/point auto-fills.</p>
          <div class="wiz-tiles" id="instr-tiles">
            ${known.map(([sym, dpp]) => `
              <div class="wiz-tile ${draft.instrument === sym ? 'selected' : ''}" data-sym="${sym}" data-dpp="${dpp}">
                <span class="tile-main">${sym}</span>
                <span class="tile-sub">$${dpp}/pt</span>
              </div>
            `).join('')}
          </div>
          <input class="wiz-custom-input" id="instr-custom" type="text" placeholder="Other symbol…" value="${draft.instrument && !state.instruments[draft.instrument] ? draft.instrument : ''}">
          <div id="custom-dpp-wrap" style="display:${draft.instrument && !state.instruments[draft.instrument] ? 'block' : 'none'}; margin-top: -8px; margin-bottom: 18px;">
            <input class="wiz-custom-input" id="instr-custom-dpp" type="number" step="0.01" placeholder="$ per point" value="${draft.instrument && !state.instruments[draft.instrument] ? (draft.dollarPerPoint || '') : ''}">
          </div>
        </div>
      `;
      content.querySelectorAll('[data-sym]').forEach(el => el.addEventListener('click', () => {
        draft.instrument = el.dataset.sym;
        draft.dollarPerPoint = parseFloat(el.dataset.dpp);
        content.querySelectorAll('[data-sym]').forEach(x => x.classList.toggle('selected', x.dataset.sym === draft.instrument));
        content.querySelector('#instr-custom').value = '';
        content.querySelector('#custom-dpp-wrap').style.display = 'none';
        updateFoot();
        // Auto-advance after a short beat
        setTimeout(() => { if (step === 1 && canAdvance()) go(2); }, 320);
      }));
      const customEl = content.querySelector('#instr-custom');
      const customDppWrap = content.querySelector('#custom-dpp-wrap');
      const customDppEl = content.querySelector('#instr-custom-dpp');
      customEl.addEventListener('input', () => {
        const sym = customEl.value.trim().toUpperCase();
        content.querySelectorAll('[data-sym]').forEach(x => x.classList.remove('selected'));
        if (sym && state.instruments[sym]) {
          draft.instrument = sym;
          draft.dollarPerPoint = state.instruments[sym];
          customDppWrap.style.display = 'none';
        } else if (sym) {
          draft.instrument = sym;
          customDppWrap.style.display = 'block';
          draft.dollarPerPoint = parseFloat(customDppEl.value) || null;
        } else {
          draft.instrument = '';
          draft.dollarPerPoint = null;
          customDppWrap.style.display = 'none';
        }
        updateFoot();
      });
      customDppEl.addEventListener('input', () => {
        draft.dollarPerPoint = parseFloat(customDppEl.value) || null;
        updateFoot();
      });
      updateFoot();
    }

    function renderSideSize() {
      const presetSizes = [1, 2, 3, 5, 10];
      content.innerHTML = `
        <div class="wiz-step active">
          <h2 class="wiz-q">Direction and size</h2>
          <p class="wiz-hint">Long or short, and how many contracts / lots.</p>
          <div class="wiz-side-grid">
            <div class="wiz-side-tile long ${draft.side === 'LONG' ? 'selected' : ''}" data-side="LONG">
              <span class="side-arrow">↗</span>
              <span class="side-label">LONG</span>
            </div>
            <div class="wiz-side-tile short ${draft.side === 'SHORT' ? 'selected' : ''}" data-side="SHORT">
              <span class="side-arrow">↘</span>
              <span class="side-label">SHORT</span>
            </div>
          </div>
          <div class="wiz-sub-label">Size</div>
          <div class="wiz-size" id="size-group">
            ${presetSizes.map(n => `<button data-size="${n}" class="${draft.size === n ? 'selected' : ''}">${n}</button>`).join('')}
            <input class="wiz-size-custom" id="size-custom" type="number" step="1" min="0" placeholder="other" value="${draft.size && !presetSizes.includes(draft.size) ? draft.size : ''}" inputmode="numeric">
          </div>
        </div>
      `;
      content.querySelectorAll('[data-side]').forEach(el => el.addEventListener('click', () => {
        draft.side = el.dataset.side;
        content.querySelectorAll('[data-side]').forEach(x => x.classList.toggle('selected', x.dataset.side === draft.side));
        updateFoot();
        // auto-advance if size also set
        setTimeout(() => { if (step === 2 && canAdvance()) go(3); }, 320);
      }));
      content.querySelectorAll('[data-size]').forEach(el => el.addEventListener('click', () => {
        draft.size = parseInt(el.dataset.size);
        content.querySelectorAll('[data-size]').forEach(x => x.classList.toggle('selected', parseInt(x.dataset.size) === draft.size));
        content.querySelector('#size-custom').value = '';
        updateFoot();
      }));
      content.querySelector('#size-custom').addEventListener('input', (e) => {
        const v = parseInt(e.target.value);
        if (v > 0) {
          draft.size = v;
          content.querySelectorAll('[data-size]').forEach(x => x.classList.remove('selected'));
        } else {
          draft.size = null;
        }
        updateFoot();
      });
      updateFoot();
    }

    function renderPrices() {
      content.innerHTML = `
        <div class="wiz-step active">
          <h2 class="wiz-q">Trade prices</h2>
          <p class="wiz-hint">Entry and stop are required. Leave exit empty if the trade is still open.</p>
          <div class="wiz-prices">
            <div class="wiz-price-row">
              <label>Entry</label>
              <input id="p-entry" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${draft.entry ?? ''}">
            </div>
            <div class="wiz-price-row">
              <label>Stop</label>
              <input id="p-stop" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${draft.stop ?? ''}">
            </div>
            <div class="wiz-price-row ${draft.exitOpen ? 'open' : ''}">
              <label>Exit</label>
              <input id="p-exit" type="number" step="0.01" inputmode="decimal" placeholder="${draft.exitOpen ? 'open trade' : '0.00'}" value="${draft.exit ?? ''}" ${draft.exitOpen ? 'disabled' : ''}>
              <button class="pill-open ${draft.exitOpen ? 'active' : ''}" id="exit-open-toggle">Open</button>
            </div>
          </div>
          <div class="wiz-live" id="wiz-live">
            <div><label>Risk</label><span id="live-risk">—</span></div>
            <div><label>P&L</label><span id="live-pnl">—</span></div>
            <div><label>R multiple</label><span id="live-r">—</span></div>
          </div>
        </div>
      `;
      const update = () => {
        draft.entry = parseFloat(content.querySelector('#p-entry').value) || null;
        draft.stop = parseFloat(content.querySelector('#p-stop').value) || null;
        if (!draft.exitOpen) {
          draft.exit = parseFloat(content.querySelector('#p-exit').value) || null;
        }
        const risk = tradeRiskD();
        const pnl = tradePnLD();
        const r = tradeRD();
        content.querySelector('#live-risk').textContent = risk ? fmt$(risk) : '—';
        const pnlEl = content.querySelector('#live-pnl');
        pnlEl.textContent = pnl != null ? fmt$(pnl, { alwaysSign: true }) : '—';
        pnlEl.className = pnl > 0 ? 'pos' : (pnl < 0 ? 'neg' : '');
        const rEl = content.querySelector('#live-r');
        rEl.textContent = r != null && isFinite(r) ? fmtR(r) : '—';
        rEl.className = r > 0 ? 'pos' : (r < 0 ? 'neg' : '');
        updateFoot();
      };
      content.querySelector('#p-entry').addEventListener('input', update);
      content.querySelector('#p-stop').addEventListener('input', update);
      content.querySelector('#p-exit').addEventListener('input', update);
      content.querySelector('#exit-open-toggle').addEventListener('click', () => {
        draft.exitOpen = !draft.exitOpen;
        if (draft.exitOpen) draft.exit = null;
        renderPrices();
      });
      setTimeout(() => content.querySelector('#p-entry').focus(), 60);
      update();
    }

    function renderContext() {
      const hasSetups = state.setups.length > 0;
      const hasEmotions = state.emotions.length > 0;
      content.innerHTML = `
        <div class="wiz-step active">
          <h2 class="wiz-q">A bit of context?</h2>
          <p class="wiz-hint">Optional — but this is what makes the best stats.</p>

          <div class="wiz-sub-label">Setup</div>
          ${hasSetups ? `
            <div class="wiz-tiles">
              ${state.setups.map(s => `
                <div class="wiz-tile ${draft.setup === s ? 'selected' : ''}" data-setup="${s}">
                  <span class="tile-main" style="font-family: var(--font-sans); font-size: 12px; font-weight: 500;">${s}</span>
                </div>
              `).join('')}
            </div>
          ` : `
            <input class="wiz-custom-input" id="setup-free" type="text" placeholder="Type your setup — it'll be added to your list" value="${draft.setup || ''}" style="text-transform:none;">
            <p style="font-size: 10px; color: var(--fg-dim); margin: -10px 0 18px; letter-spacing: 0.03em;">Tip: add your usual setups in Settings to pick them in one click.</p>
          `}

          <div class="wiz-sub-label">Setup rating</div>
          <div class="wiz-rating" id="rate-group">
            ${[1,2,3,4,5].map(n => `<button data-rate="${n}" class="${draft.rating === n ? 'selected' : ''}">${n}</button>`).join('')}
          </div>

          <div class="wiz-sub-label">Emotion</div>
          ${hasEmotions ? `
            <div class="emo-chips" style="margin-bottom: 18px;" id="emo-group">
              ${state.emotions.map(e => `<button data-emo="${e}" class="${draft.emotion === e ? 'active' : ''}">${e}</button>`).join('')}
            </div>
          ` : `
            <input class="wiz-custom-input" id="emo-free" type="text" placeholder="How did you feel?" value="${draft.emotion || ''}" style="text-transform:none; margin-bottom: 18px;">
          `}
        </div>
      `;
      content.querySelectorAll('[data-setup]').forEach(el => el.addEventListener('click', () => {
        draft.setup = draft.setup === el.dataset.setup ? '' : el.dataset.setup;
        content.querySelectorAll('[data-setup]').forEach(x => x.classList.toggle('selected', x.dataset.setup === draft.setup));
      }));
      content.querySelectorAll('[data-rate]').forEach(el => el.addEventListener('click', () => {
        const v = parseInt(el.dataset.rate);
        draft.rating = draft.rating === v ? null : v;
        content.querySelectorAll('[data-rate]').forEach(x => x.classList.toggle('selected', parseInt(x.dataset.rate) === draft.rating));
      }));
      content.querySelectorAll('[data-emo]').forEach(el => el.addEventListener('click', () => {
        draft.emotion = draft.emotion === el.dataset.emo ? '' : el.dataset.emo;
        content.querySelectorAll('[data-emo]').forEach(x => x.classList.toggle('active', x.dataset.emo === draft.emotion));
      }));
      const setupFree = content.querySelector('#setup-free');
      if (setupFree) setupFree.addEventListener('input', (e) => { draft.setup = e.target.value.trim(); });
      const emoFree = content.querySelector('#emo-free');
      if (emoFree) emoFree.addEventListener('input', (e) => { draft.emotion = e.target.value.trim(); });
      updateFoot();
    }

    function renderReview() {
      const risk = tradeRiskD();
      const pnl = tradePnLD();
      const r = tradeRD();
      content.innerHTML = `
        <div class="wiz-step active">
          <h2 class="wiz-q">One screenshot and we're done?</h2>
          <p class="wiz-hint">Paste (Ctrl+V), drag, or tap the zone. Then check the recap.</p>
          <div class="wiz-drop" id="wiz-drop">
            <div class="wiz-drop-title" id="wiz-drop-title">Drop, paste or tap</div>
            <div class="wiz-drop-hint"><kbd>⌘</kbd><kbd>V</kbd> / <kbd>Ctrl</kbd><kbd>V</kbd> from clipboard · drag & drop · click</div>
          </div>
          <input id="wiz-file" type="file" accept="image/*" multiple hidden>
          <div class="thumbs" id="wiz-thumbs" style="margin-bottom: 14px;"></div>

          <textarea class="wiz-note" id="wiz-note" placeholder="Note (optional) — what you want to remember">${draft.note || ''}</textarea>
          <input class="wiz-link" id="wiz-link" type="url" placeholder="Chart link (optional) — TradingView, Imgur…" value="${draft.chartLink || ''}">

          <div class="wiz-result" style="margin-top: 20px;">
            <div><label>Risk</label><span>${risk ? fmt$(risk) : '—'}</span></div>
            <div><label>P&L</label><span class="${pnl > 0 ? 'pos' : (pnl < 0 ? 'neg' : '')}">${pnl != null ? fmt$(pnl, { alwaysSign: true }) : 'open'}</span></div>
            <div><label>R</label><span class="${r > 0 ? 'pos' : (r < 0 ? 'neg' : '')}">${r != null && isFinite(r) ? fmtR(r) : '—'}</span></div>
          </div>

          <div class="wiz-review">
            <div class="wiz-review-row">
              <label>Instrument</label>
              <span>${draft.instrument} <span class="muted">· $${draft.dollarPerPoint}/pt</span></span>
            </div>
            <div class="wiz-review-row">
              <label>Side / Size</label>
              <span style="color: var(--${draft.side === 'LONG' ? 'accent' : 'loss'})">${draft.side}</span><span class="muted">×${draft.size}</span>
            </div>
            <div class="wiz-review-row">
              <label>Prices</label>
              <span>${fmtPrice(draft.entry)} <span class="muted">→</span> ${draft.exitOpen ? '<span class="muted">open</span>' : fmtPrice(draft.exit)} <span class="muted">· SL ${fmtPrice(draft.stop)}</span></span>
            </div>
            ${draft.setup || draft.emotion || draft.rating ? `
            <div class="wiz-review-row">
              <label>Context</label>
              <span style="font-family: var(--font-sans);">
                ${draft.setup ? draft.setup : '<span class="muted">—</span>'}
                ${draft.rating ? ' <span class="muted">·</span> ' + draft.rating + '/5' : ''}
                ${draft.emotion ? ' <span class="muted">·</span> ' + draft.emotion : ''}
              </span>
            </div>
            ` : ''}
            <div class="wiz-review-row">
              <label>Date</label>
              <span>${draft.date}${draft.time ? ' <span class="muted">·</span> ' + draft.time : ''}</span>
            </div>
          </div>
        </div>
      `;

      const dropzone = content.querySelector('#wiz-drop');
      const fileInput = content.querySelector('#wiz-file');
      const thumbs = content.querySelector('#wiz-thumbs');
      const noteEl = content.querySelector('#wiz-note');
      const linkEl = content.querySelector('#wiz-link');

      function renderThumbs() {
        thumbs.innerHTML = draft.screenshots.map((src, i) => `
          <div class="thumb-wrap">
            <img src="${src}" alt="Screenshot ${i+1}" data-view="${i}">
            <button class="rm-thumb" data-rm="${i}" aria-label="Remove">×</button>
          </div>
        `).join('');
        thumbs.querySelectorAll('[data-view]').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
        thumbs.querySelectorAll('[data-rm]').forEach(btn => btn.addEventListener('click', () => {
          draft.screenshots.splice(parseInt(btn.dataset.rm), 1);
          renderThumbs();
        }));
      }
      renderThumbs();

      async function addFiles(files) {
        if (!files || !files.length) return;
        content.querySelector('#wiz-drop-title').textContent = 'Processing…';
        const urls = await filesToDataUrls(files);
        draft.screenshots.push(...urls);
        content.querySelector('#wiz-drop-title').textContent = 'Drop, paste or tap';
        renderThumbs();
        if (urls.length) toast(urls.length + ' image' + (urls.length > 1 ? 's' : '') + ' added');
      }

      dropzone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => addFiles(e.target.files));
      dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag');
        addFiles(e.dataTransfer.files);
      });
      noteEl.addEventListener('input', () => { draft.note = noteEl.value; });
      linkEl.addEventListener('input', () => { draft.chartLink = linkEl.value; });

      if (wizPasteHandler) window.removeEventListener('paste', wizPasteHandler);
      wizPasteHandler = (e) => {
        const items = e.clipboardData?.items || [];
        const files = [];
        for (const it of items) {
          if (it.kind === 'file') {
            const f = it.getAsFile();
            if (f) files.push(f);
          }
        }
        if (files.length) {
          e.preventDefault();
          addFiles(files);
        }
      };
      window.addEventListener('paste', wizPasteHandler);
      updateFoot();
    }

    renderStep();
  }

  function openLightbox(src) {
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `<img src="${src}" alt="">`;
    lb.addEventListener('click', () => lb.remove());
    document.addEventListener('keydown', function onKey(e) {
      if (e.key === 'Escape') { lb.remove(); document.removeEventListener('keydown', onKey); }
    });
    document.body.appendChild(lb);
  }

  // ====================================================================
  //  Export / Import / Clear
  // ====================================================================
  async function exportData() {
    const payload = {
      v: 1,
      exported: new Date().toISOString(),
      trades: state.trades,
      instruments: state.instruments,
      setups: state.setups,
      emotions: state.emotions,
    };
    const data = JSON.stringify(payload, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if (!win) {
      try {
        await navigator.clipboard.writeText(data);
        toast('Export copied to clipboard');
      } catch {
        toast('Export failed — try again');
      }
    } else {
      toast('Export opened — save the page (Cmd/Ctrl+S)');
    }
  }
  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!Array.isArray(parsed.trades)) { toast('Invalid format'); return; }
        if (!window.confirm(`Import ${parsed.trades.length} trade(s)? This will replace your current data.`)) return;
        await dbClear('trades');
        state.trades = parsed.trades;
        if (parsed.instruments && typeof parsed.instruments === 'object') {
          state.instruments = parsed.instruments;
          await saveInstruments();
        }
        if (Array.isArray(parsed.setups)) {
          state.setups = parsed.setups;
          await saveSetups();
        }
        if (Array.isArray(parsed.emotions)) {
          state.emotions = parsed.emotions;
          await saveEmotions();
        }
        for (const t of state.trades) await saveTrade(t);
        render();
        toast('Imported');
      } catch (err) {
        console.error(err);
        toast('Read error');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
  async function clearAll() {
    if (!window.confirm('Really clear everything? This action is irreversible.')) return;
    await dbClear('trades');
    await dbClear('settings');
    state = { trades: [], instruments: { ...DEFAULT_INSTRUMENTS }, setups: [], emotions: [], obsidian: { ...DEFAULT_OBSIDIAN } };
    render();
    toast('Data cleared');
  }

  // ====================================================================
  //  Routing & init
  // ====================================================================
  function render() {
    const views = { dash: renderDashboard, trades: renderTrades, stats: renderStats, settings: renderSettings };
    (views[currentView] || renderDashboard)();
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    render();
  });

  document.getElementById('btn-new-trade').addEventListener('click', () => openWizard());

  const validViews = ['dash','trades','stats','settings'];
  function applyHash() {
    const h = location.hash.replace('#','');
    if (validViews.includes(h)) {
      currentView = h;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === h));
      render();
    }
  }
  window.addEventListener('hashchange', applyHash);

  window.openTradeModal = openTradeModal;
  window.openWizard = openWizard;

  // Boot
  (async () => {
    await loadState();
    applyHash();
    render();
  })();
</script>
